name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install streamlit pytest

      - name: Validate nattd.json structure
        run: python -m pytest tests/test_nattd_structure.py -v

      - name: Builder end-to-end tests
        run: python -m pytest tests/test_builder.py -v

      - name: Shell syntax check (template + bonus scripts)
        run: |
          bash -n template.sh
          for f in bonus/*.sh; do bash -n "$f"; done

  # Lint the Python application code (blocking: ruleset is fixed in
  # pyproject.toml so the result is deterministic).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.16.9"

      - name: Ruff
        run: ruff check .
