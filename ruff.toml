# Ruff configuration (kept in ruff.toml instead of pyproject.toml on
# purpose: Streamlit Cloud treats a root pyproject.toml as an installable
# package and the deploy breaks - this repo is not a Python package).
target-version = "py312"

[lint]
# Core correctness ruleset: pycodestyle errors, pyflakes, ambiguous names.
# Kept explicit (not ruff's ever-widening defaults) so CI is deterministic;
# extend deliberately when a new rule family is adopted.
select = ["E4", "E7", "E9", "F"]
