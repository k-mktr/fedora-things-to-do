<svg xmlns="http://www.w3.org/2000/svg" width="620" height="152" viewBox="0 0 620 152" role="img" aria-labelledby="title">
  <title id="title">NATTD — ASCII and pixel art logo</title>
  <!-- Pixel-edged terminal window -->
  <path d="M20 14h94v8h8v94h-8v8H20v-8h-8V22h8Z" fill="none" stroke="#F5F8FC" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M16 39h102" stroke="#F5F8FC" stroke-width="5"/>
  <rect x="25" y="23" width="7" height="7" fill="#1685F8"/>
  <rect x="38" y="23" width="7" height="7" fill="#F5F8FC"/>
  <rect x="51" y="23" width="7" height="7" fill="#F5F8FC"/>
  <!-- ASCII prompt + checklist -->
  <text x="27" y="66" fill="#F5F8FC" font-family="Consolas,monospace" font-size="19" font-weight="700">&gt;_</text>
  <text x="27" y="88" fill="#F5F8FC" font-family="Consolas,monospace" font-size="16" font-weight="700">[+]</text>
  <text x="27" y="109" fill="#F5F8FC" font-family="Consolas,monospace" font-size="16" font-weight="700">[ ]</text>
  <!-- Terminal output resolving into pixels -->
  <rect x="73" y="72" width="11" height="11" fill="#1685F8"/>
  <rect x="86" y="59" width="11" height="11" fill="#1685F8"/>
  <rect x="99" y="72" width="11" height="11" fill="#1685F8"/>
  <rect x="86" y="85" width="11" height="11" fill="#1685F8"/>
  <rect x="99" y="98" width="11" height="11" fill="#FFB547"/>
  <text x="154" y="99" fill="#F5F8FC" font-family="Consolas,ui-monospace,monospace" font-size="61" font-weight="700" letter-spacing="2">NATTD</text>
</svg>

